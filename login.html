<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Smart Lock System</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="icon" type="image/x-icon" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/svgs/solid/lock.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            poppins: ['Poppins', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    .login-bg {
      background-color: rgba(0, 0, 0, 0.5);
      background-image: url('https://images.pexels.com/photos/1181244/pexels-photo-1181244.jpeg?auto=compress&cs=tinysrgb&w=1600');
      background-size: cover;
      background-position: center;
      background-blend-mode: overlay;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .form-input {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
    }
    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }
    .form-input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.2);
    }
    #error-msg {
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #error-msg.visible {
      opacity: 1;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .shake {
      animation: shake 0.5s ease-in-out;
    }
  </style>
</head>
<body class="font-poppins min-h-screen flex flex-col login-bg">
  
  <nav class="bg-gradient-to-r from-blue-600 to-blue-800 text-white p-4 shadow-lg">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fas fa-lock text-2xl"></i>
        <a href="index.html" class="text-xl font-bold hover:text-blue-200 transition-colors duration-200">Smart Lock System</a>
      </div>
      <ul class="flex space-x-6">
        <li><a href="login.html" class="text-blue-200 flex items-center"><i class="fas fa-sign-in-alt mr-1"></i> Login</a></li>
      </ul>
    </div>
  </nav>


  <main class="flex-grow flex items-center justify-center p-4">
    <div class="glass-card p-8 rounded-2xl w-full max-w-md mx-auto transform transition-all duration-300 hover:scale-[1.02]">
      <div class="text-center mb-8">
        <i class="fas fa-lock-open text-4xl text-white mb-4"></i>
        <h1 class="text-3xl font-bold text-white mb-2">Welcome!</h1>
        <p class="text-gray-200"></p>
      </div>

      <form id="login-form" class="space-y-6">
        <div>
          <label for="username" class="block text-white mb-2 font-medium">Username</label>
          <div class="relative">
            <i class="fas fa-user absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-300"></i>
            <input
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              class="form-input w-full px-10 py-3 rounded-lg focus:ring-2 focus:ring-blue-400 transition-all duration-200"
              placeholder="Enter your username"
              required
            />
          </div>
        </div>

        <div>
          <label for="password" class="block text-white mb-2 font-medium">Password</label>
          <div class="relative">
            <i class="fas fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-300"></i>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              class="form-input w-full px-10 py-3 rounded-lg focus:ring-2 focus:ring-blue-400 transition-all duration-200"
              placeholder="Enter your password"
              required
            />
          </div>
        </div>

        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center text-gray-200">
            <input type="checkbox" name="remember" class="form-checkbox rounded text-blue-500 mr-2" autocomplete="remember">
            Remember me
          </label>
          <a href="#" class="text-blue-400 hover:text-blue-300 transition-colors duration-200">Forgot Password?</a>
        </div>

        <button
          type="submit"
          class="w-full bg-gradient-to-r from-blue-500 to-blue-700 text-white font-bold py-3 px-4 rounded-lg hover:from-blue-600 hover:to-blue-800 transition-all duration-200 transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-opacity-50"
        >
          <i class="fas fa-sign-in-alt mr-2"></i>Login
        </button>

        <div id="error-msg" class="hidden bg-red-500 bg-opacity-20 text-red-100 text-center py-2 rounded-lg"></div>
      </form>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="login.js"></script>
</body>
</html>
